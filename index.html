<body>
<div id="root"></div>
<script>
document.addEventListener('contextmenu', event => event.preventDefault());
document.onkeydown = function(e) {
    if (e.keyCode == 123) {
        return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
        return false;
    }
};

let users = JSON.parse(localStorage.getItem('ssig_users') || '[]');
let currentUser = JSON.parse(sessionStorage.getItem('ssig_user') || 'null');
let view = currentUser ? 'invoice' : 'auth';
let authTab = 'login';
let showPreview = false;
let loginForm = { email: '', password: '', error: '' };
let regForm = { name: '', email: '', password: '', confirm: '', error: '' };
// Invoice number is now read from localStorage without incrementing.
// It is incremented only after a PDF is successfully generated.
let invoice = {invoiceNo: getCurrentInvoiceNumber(),date: new Date().toISOString().slice(0, 10),customerName: '',customerMobile: '',gstin: '',items: [{ id: 1, particular: '', qty: '', rate: '', amount: 0 }]};
let invoicePdfGenerated = false;
function pdfFmt(n) {return 'Rs. ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');}
function save() { localStorage.setItem('ssig_users', JSON.stringify(users)); }
function calcItem(item) { item.amount = (parseFloat(item.qty)||0) * (parseFloat(item.rate)||0); return item; }
function getSubtotal() { return invoice.items.reduce((s, it) => s + (it.amount||0), 0); }
function getSGST() { return getSubtotal() * 0.025; }
function getCGST() { return getSubtotal() * 0.025; }
function getTotal() { return getSubtotal() + getSGST() + getCGST(); }
function getGrandTotal() { return Math.round(getTotal()); }
function getRoundOff() { return getGrandTotal() - getTotal(); }
function fmt(n) { return '₹' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function doLogin() {
const u = users.find(u => u.email===loginForm.email && u.password===loginForm.password);
if (!u) { loginForm.error='Invalid email or password'; render(); return; }

// Subscription Expiry Check
//const expiryDate = new Date('2026-05-30T00:00:00.000Z');
const today = new Date();
const expiryDate = new Date(u.expiryDate);

if (today > expiryDate) {
	loginForm.error = 'Your subscription has expired. Please contact Admin to renew your plan.';render(); return;
}

currentUser=u; sessionStorage.setItem('ssig_user',JSON.stringify(u)); view='invoice'; render();
}
function doRegister() {
if (!regForm.name||!regForm.email||!regForm.password) { regForm.error='All fields required'; render(); return; }
if (regForm.password!==regForm.confirm) { regForm.error='Passwords do not match'; render(); return; }
if (users.find(u=>u.email===regForm.email)) { regForm.error='Email already registered'; render(); return; }

// Registration Date & Expiry Date = 30 Days
const createdDate = new Date();
const expiryDate = new Date(); expiryDate.setDate(expiryDate.getDate() + 30);

//const u={name:regForm.name,email:regForm.email,password:regForm.password};

const u = {name: regForm.name,email: regForm.email,password: regForm.password,createdAt: createdDate.toISOString(),expiryDate: expiryDate.toISOString()
};

users.push(u); save(); currentUser=u; sessionStorage.setItem('ssig_user',JSON.stringify(u)); view='invoice'; render();
}

function doLogout() { currentUser=null; sessionStorage.removeItem('ssig_user'); view='auth'; render(); }
function getDaysRemaining() {
  if (!currentUser || !currentUser.expiryDate) {
    return 0;
  }

  const today = new Date();
  const expiry = new Date(currentUser.expiryDate);
  const diffTime = expiry - today;
  return Math.max(0,Math.ceil(diffTime / (1000 * 60 * 60 * 24))
  );
}

function formatExpiryDate(dateString) {
  const d = new Date(dateString);
  return d.toLocaleDateString(
    'en-IN',{day: '2-digit',month: 'short',year: 'numeric'
    }
  );
}

function addRow() { invoice.items.push({id:Date.now(),particular:'',qty:'',rate:'',amount:0}); render(); }
function removeRow(id) { if(invoice.items.length===1)return; invoice.items=invoice.items.filter(it=>it.id!==id); render(); }
function updateItem(id,field,val) {
  invoice.items=invoice.items.map(it=>{if(it.id===id){it[field]=val;calcItem(it);}return it;});
  renderTotals();
}
function renderTotals() { const el = document.getElementById('totals-section');
if (el) {
      el.innerHTML = totalsHTML();
      // Update amount in words
      updateAmountInWords();
  }
}

function getCurrentInvoiceNumber() {
  let lastInvoiceNo = parseInt(localStorage.getItem("lastInvoiceNo") || "1", 10);
  if (!Number.isFinite(lastInvoiceNo) || lastInvoiceNo < 1) lastInvoiceNo = 1;
  return "SS-" + String(lastInvoiceNo).padStart(3, '0');
}

function advanceInvoiceNumber() {
  let currentNo = parseInt(localStorage.getItem("lastInvoiceNo") || "1", 10);
  if (!Number.isFinite(currentNo) || currentNo < 1) currentNo = 1;

  const nextNo = currentNo + 1;
  localStorage.setItem("lastInvoiceNo", String(nextNo));
  return "SS-" + String(nextNo).padStart(3, '0');
}

// One-time reset requested for this application: start from SS-001.
// After the first PDF is generated, the number will move to SS-002.
if (localStorage.getItem("invoiceNumberResetV1") !== "done") {
  localStorage.setItem("lastInvoiceNo", "1");
  localStorage.setItem("invoiceNumberResetV1", "done");
  invoice.invoiceNo = "SS-001";
}

function numberToWords(num) {
    const ones = [
        "", "One", "Two", "Three", "Four", "Five",
        "Six", "Seven", "Eight", "Nine", "Ten",
        "Eleven", "Twelve", "Thirteen", "Fourteen",
        "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
    ];
    const tens = [
        "", "", "Twenty", "Thirty", "Forty",
        "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"
    ];
    function convertHundreds(n) {
        let str = "";
        if (n > 99) {
            str += ones[Math.floor(n / 100)] + " Hundred ";
            n = n % 100;
        }
        if (n > 19) {
            str += tens[Math.floor(n / 10)] + " ";
            n = n % 10;
        }
        if (n > 0) {
            str += ones[n] + " ";
        }
        return str.trim();
    }

    if (num == 0) return "Zero Only";
    let result = "";
    if (num >= 100000) {
        result += convertHundreds(Math.floor(num / 100000)) + " Lakh ";
        num = num % 100000;
    }
    if (num >= 1000) {
        result += convertHundreds(Math.floor(num / 1000)) + " Thousand ";
        num = num % 1000;
    }
    if (num > 0) {
        result += convertHundreds(num);
    }
    return result.trim() + " Only";
}

function updateAmountInWords() {
    let amount = getGrandTotal();
    document.getElementById("amountWords").innerText =
        numberToWords(amount);
}

function totalsHTML() {
  return `<div class="totals-section"><div class="totals-box">
    <div class="total-row"><span>Subtotal</span><span>${pdfFmt(getSubtotal())}</span></div>
    <div class="total-row"><span>SGST (2.5%)</span><span>${pdfFmt(getSGST())}</span></div>
    <div class="total-row"><span>CGST (2.5%)</span><span>${pdfFmt(getCGST())}</span></div>
    <div class="total-row"><span>Total</span><span>${pdfFmt(getTotal())}</span></div>
    <div class="total-row"><span>Round Off</span><span>${getRoundOff()>=0?'+':''}${getRoundOff().toFixed(2)}</span></div>
    <div class="total-row grand"><span>Grand Total</span><span id="grandTotal">${pdfFmt(getGrandTotal())}</span></div>
    <div class="total-row">In words Rupees :<span id="amountWords"></span></div>
  </div></div>`;
}

async function generatePDF() {
  // Prevent the same invoice from receiving multiple invoice numbers if
  // the PDF button is clicked again after a successful generation.
  if (invoicePdfGenerated) {
    alert('This invoice PDF has already been generated. Please click Reset to create the next invoice.');
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','a4');
  const pink=[194,24,91],
        pinkLight=[255,240,245],
        gray=[97,97,97];

  let y=15;

  // =========================
  // Marathi Header Image
  // =========================
  const canvas = await html2canvas(
    document.getElementById("marathiHeader"),
    {
      scale:2
    }
  );

  const imgData = canvas.toDataURL("image/png");
  doc.addImage(imgData,'PNG',0,0,210,43);
  // =========================

  doc.setTextColor(255,255,255);
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  y=50;

  doc.setTextColor(50,50,50);
  doc.setFillColor(...pinkLight);
  doc.rect(10,y-5,90,22,'F');
  doc.rect(110,y-5,90,22,'F');
  doc.setFontSize(8);
  doc.setFont('helvetica','bold');
  doc.setTextColor(...gray);
  doc.text('BILLED TO',15,y);
  doc.text('INVOICE DETAILS',115,y);
  doc.setFont('helvetica','normal');
  doc.setTextColor(50,50,50);
  doc.setFontSize(9);
  doc.text(invoice.customerName||'-',15,y+7);

  if(invoice.customerMobile)
    doc.text('Mobile: +91 '+invoice.customerMobile,15,y+12);
    doc.text('GSTIN: '+(invoice.gstin||'N/A'),15,y+(invoice.customerMobile?17:12));
    doc.text('Invoice No: '+invoice.invoiceNo,115,y+7);
    doc.text('Date: '+invoice.date,115,y+14);
    y+=20;

  doc.setFillColor(...pink);
  doc.rect(10,y,190,8,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.text('Particulars',15,y+5.5);
  doc.text('Qty',110,y+5.5,{align:'center'});
  doc.text('Rate',140,y+5.5,{align:'center'});
  doc.text('Amount',192,y+5.5,{align:'right'});
  y+=8;

  doc.setFont('helvetica','normal');
  doc.setTextColor(50,50,50);
  invoice.items.forEach((it,i)=>{
    if(i%2===1){
      doc.setFillColor(255,240,245);
      doc.rect(10,y-1,190,6,'F');
    }

    doc.setFontSize(9);
    doc.text(it.particular||'-',15,y+3);

    doc.text(
      it.qty?it.qty.toString():'-',
      110,
      y+3,
      {align:'center'}
    );

    doc.text(
      it.rate ? pdfFmt(parseFloat(it.rate)) : '-',
      140,
      y+3,
      {align:'center'}
    );

    doc.text(
      pdfFmt(it.amount),
      192,
      y+3,
      {align:'right'}
    );
	// ========================= grid hight
    y+=6;
  });

  y+=2;

  doc.setDrawColor(...pink);
  doc.line(10,y,200,y);
  y+=5;
  const col1=130,
        col2=192;

  doc.setFontSize(9);
  [
    ['Subtotal',pdfFmt(getSubtotal())],
    ['SGST (2.5%)',pdfFmt(getSGST())],
    ['CGST (2.5%)',pdfFmt(getCGST())],
    ['Total',pdfFmt(getTotal())],
    ['Round Off',(getRoundOff()>=0?'+':'')+getRoundOff().toFixed(2)]
  ].forEach(([l,v])=>{

    doc.setFont('helvetica','normal');
    doc.setTextColor(...gray);
    doc.text(l,col1,y);
    doc.setTextColor(50,50,50);
    doc.text(v,col2,y,{align:'right'});
    y+=5;
  });

  doc.setFillColor(...pink);
  doc.rect(col1-5,y-3,200-col1+5,10,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('GRAND TOTAL',col1,y+4);

  doc.text(pdfFmt(getGrandTotal()), col2,y+4, {align:'right'});

  y+=16;
  doc.setTextColor(80,80,80);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.text('In words Rupees : ' + numberToWords(getGrandTotal()),10,y);
  y += 10;

  doc.text('Declaration : We declare that this invoice shows the actual price of goods described & particulars are true & correct.',10,y);
  y += 5;
  doc.text('Terms : No refund Subject to Islampur Jurisdiction. ',10,y);

// ==========================
// Bank Details Section
// ==========================

y += 10;

// Section Title
doc.setFontSize(12);
doc.setFont('helvetica','bold');
doc.setTextColor(...pink);
doc.text('Bank Details',10,y);
y += 1;
doc.setDrawColor(...pink);
doc.line(10,y,200,y);


// Light Pink Box
doc.setFillColor(245,235,240);
doc.setDrawColor(255,192,203);
doc.roundedRect(10,y+2,80,30,4,4,'FD');

// Left Labels
doc.setFont('helvetica','normal');
doc.setFontSize(10);
doc.setTextColor(110,110,110);
doc.text('Bank Name',16,y+10);
doc.text('Branch',16,y+15);
doc.text('A/c. No.',16,y+20);
doc.text('IFSC Code',16,y+25);
// Right Values
doc.setFont('helvetica','bold');
doc.setTextColor(40,40,40);
doc.text('ICICI Bank',88,y+10,{align:'right'});
doc.text('Islampur',88,y+15,{align:'right'});
doc.text('095505007541',88,y+20,{align:'right'});
doc.text('ICIC0000955',88,y+25,{align:'right'});
y += 50;
// ==========================

  doc.setTextColor(...gray);
  doc.setFont('helvetica','italic');
  doc.setFontSize(8);
  doc.text(
    'Thank you for your business! Visit Again! This is a computer-generated invoice.',
    105,
    y+8,
    {align:'center'}
  );

  doc.save(
    'Snehsagar_Invoice_'+invoice.invoiceNo+'.pdf'
  );

  // IMPORTANT: advance the invoice number ONLY after PDF generation.
  // The PDF keeps the current number (e.g. SS-001); the next invoice
  // will use SS-002.
  invoicePdfGenerated = true;
  invoice.invoiceNo = advanceInvoiceNumber();
  render();

  alert('PDF generated successfully. Next Invoice No. is ' + invoice.invoiceNo);
}

function printInvoice() {
  const content=document.getElementById('print-area');
  if(!content)return;
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Invoice</title><style>body{font-family:Segoe UI,sans-serif;margin:0;}table{width:100%;border-collapse:collapse;}th{background:#C2185B;color:#fff;padding:8px;}td{padding:6px 8px;border-bottom:1px solid #eee;}</style></head><body>');
  w.document.write(content.innerHTML);
  w.document.write('</body></html>');
  w.document.close(); w.print();
}
